# Larger FastCGI buffers so big response headers fit. Laravel's
# AddLinkHeadersForPreloadedAssets emits one `Link: rel=preload` entry per asset
# chunk; asset-heavy pages (admin, auth) exceed nginx's default 4k header buffer
# and fail with "upstream sent too big header" (502). Mirror this in production.
fastcgi_buffer_size 32k;
fastcgi_buffers 16 16k;
fastcgi_busy_buffers_size 32k;
